<!doctype html>
<html lang="en">
<head>

  <title>FinalMotion Story — Hyperframes</title>
  <style>
    @font-face{font-family:Caption;src:url('assets/ArialBold.ttf');font-weight:700}

    @font-face{font-family:Accent;src:url('assets/Accent.ttc')}
    @font-face{font-family:Editorial;src:url('assets/Editorial.ttf')}
    *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#090b0e}
    #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#090b0e}
    #plate{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;transform-origin:50% 43%}

    .source{position:absolute;width:2px;height:2px;left:-20px;top:-20px;opacity:.001}
    .burn{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;mix-blend-mode:screen;opacity:.68}

</head>
